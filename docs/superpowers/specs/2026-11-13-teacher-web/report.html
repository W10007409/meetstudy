<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공부 리포트</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F7F6; --sheet: #FFFFFF; --ink: #18212B; --ink-2: #56626F; --ink-3: #9AA5B1;
    --rule: #E3E8E6; --teal: #1F8A82; --hi: #FFE45C;
    --study: #4CC38A; --away: #9AA3AE; --off: #FF9F43; --rest: #5AA9FF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans KR", system-ui, sans-serif; }
  .page { max-width: 1080px; margin: 0 auto; padding: 28px 24px 48px; }

  /* Header: date as the title, tabs to the right. */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .top p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { font: inherit; font-size: 14px; border: 0; background: none; color: var(--ink-2); padding: 8px 14px; border-radius: 10px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; font-weight: 600; }
  .tabs button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* Summary straight on the paper: ring + headline, then three numbers. */
  .summary { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; margin-bottom: 32px; }
  .ring { position: relative; width: 168px; height: 168px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .v { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .v b { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .ring .v span { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .headline { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { color: var(--ink-2); font-size: 15px; margin: 0 0 20px; }
  .stars { color: #E9B400; letter-spacing: 2px; }
  .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
  .num { padding: 14px 16px 0 0; }
  .num + .num { padding-left: 16px; border-left: 1px solid var(--rule); }
  .num .k { font-size: 13px; color: var(--ink-2); }
  .num .val { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .num .d { font-size: 13px; font-weight: 600; }
  .d.good { color: var(--teal); } .d.bad { color: #C2410C; }

  /* The planner: the one sheet on the page. */
  .main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .sheet { background: var(--sheet); border-radius: 18px; padding: 22px; box-shadow: 0 1px 0 var(--rule), 0 10px 30px -18px rgba(24,33,43,.25); }
  .sheet h2, .side h2 { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .hint { font-size: 13px; color: var(--ink-2); margin: 0 0 16px; }
  .planner { display: grid; grid-template-columns: 44px repeat(6, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); }
  .planner .h, .planner .cell, .planner .m { border-bottom: 1px solid var(--rule); }
  .planner .m { font-size: 11px; color: var(--ink-3); padding: 4px 0 4px 4px; border-left: 1px dashed var(--rule); }
  .planner .h { font-size: 13px; font-weight: 600; padding: 12px 0; font-variant-numeric: tabular-nums; }
  .planner .cell { height: 48px; padding: 8px 3px; border-left: 1px dashed var(--rule); }
  .planner .fill { display: flex; height: 100%; border-radius: 5px; overflow: hidden; background: #EEF2F1; }
  .planner .fill i { flex: 1; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }

  .log { list-style: none; margin: 20px 0 0; padding: 0; border-top: 1px solid var(--rule); }
  .log li { display: grid; grid-template-columns: 52px 12px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .log time { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .log .c { width: 10px; height: 10px; border-radius: 3px; }
  .log .dur { color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* Side: quieter, no card frame. */
  .side { padding: 4px 2px; }
  .week-total { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 2px; }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 150px; align-items: end; margin: 18px 0 6px; }
  .bar { position: relative; height: 100%; display: flex; align-items: flex-end; }
  .bar i { display: block; width: 100%; background: #CFE7E3; border-radius: 6px 6px 2px 2px; }
  .bar.today i { background: var(--teal); }
  .bar.goal::after { content: "★"; position: absolute; top: -2px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #E9B400; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; font-size: 12px; color: var(--ink-3); }
  .days .today { color: var(--ink); font-weight: 700; }
  .streak { margin-top: 18px; font-size: 14px; color: var(--ink-2); }
  .streak b { color: var(--ink); background: linear-gradient(transparent 55%, var(--hi) 55%); padding: 0 2px; }
  .proof { margin-top: 24px; display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
  .proof .img { aspect-ratio: 4/3; border-radius: 10px; background: repeating-linear-gradient(0deg, #fff 0 9px, #E6ECEA 9px 10px); border: 1px solid var(--rule); }
  .proof p { margin: 0; font-size: 14px; } .proof small { color: var(--ink-2); font-size: 13px; }

  @media (max-width: 820px) {
    .summary { grid-template-columns: minmax(0, 1fr); }
    .main { grid-template-columns: minmax(0, 1fr); }
    .headline { font-size: 28px; }
  }
  @media (max-width: 480px) {
    .page { padding: 20px 16px 40px; }
    .nums { grid-template-columns: 1fr; }
    .num + .num { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); }
    .num { padding: 12px 0; }
    .sheet { padding: 16px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1>11월 13일 목요일의 공부</h1>
      <p>오후 2:10부터 3:18까지</p>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true">이번 공부</button>
      <button role="tab" aria-selected="false">주간</button>
      <button role="tab" aria-selected="false">월간</button>
    </div>
  </header>

  <section class="summary">
    <div class="ring" aria-label="집중률">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#E3E8E6" stroke-width="12"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#1F8A82" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 400"/></svg>
      <div class="v"><b id="rate">0%</b><span>집중률</span></div>
    </div>
    <div>
      <p class="headline" id="headline"></p>
      <p class="sub">목표 50분을 채웠어요 <span class="stars" aria-label="별 2개">★★</span></p>
      <div class="nums">
        <div class="num"><div class="k">순공부</div><div class="val" id="focused"></div><div class="d good">지난번보다 12분 늘었어요</div></div>
        <div class="num"><div class="k">흐트러진 시간</div><div class="val" id="lost"></div><div class="d good">2분 줄었어요</div></div>
        <div class="num"><div class="k">쉬는 시간</div><div class="val" id="rest"></div><div class="d" style="color:var(--ink-2)">1번 쉬었어요</div></div>
      </div>
    </div>
  </section>

  <section class="main">
    <div class="sheet">
      <h2>공부 시간표</h2>
      <p class="hint">한 칸이 10분이에요. 색칠된 만큼 그 시간을 그렇게 보냈어요.</p>
      <div class="planner" id="planner"></div>
      <div class="legend">
        <span style="--c:var(--study)">공부</span><span style="--c:var(--off)">다른 곳 봄</span><span style="--c:var(--away)">자리 비움</span><span style="--c:var(--rest)">휴식</span>
      </div>
      <ul class="log" id="log"></ul>
    </div>

    <aside class="side">
      <h2>이번 주</h2>
      <div class="week-total">4시간 12분</div>
      <div class="hint" style="margin:0">하루 평균 36분 공부했어요</div>
      <div class="bars" id="bars"></div>
      <div class="days" id="days"></div>
      <p class="streak"><b>4일 연속</b> 목표를 채웠어요. 이번 주 별은 6개예요.</p>
      <div class="proof">
        <div class="img" role="img" aria-label="인증한 문제집 사진"></div>
        <div><p>인증한 문제집</p><small>공부를 마치고 찍은 사진이에요</small></div>
      </div>
    </aside>
  </section>
</div>

<script>
  // Session segments in minutes since 14:00 (mock data in the app's own shape).
  const S = [
    [10, 31, 'study'], [31, 34, 'off'], [34, 47, 'study'], [47, 55, 'rest'],
    [55, 66, 'study'], [66, 67, 'off'], [67, 69, 'study'], [69, 72, 'away'], [72, 78, 'study'],
  ];
  const COLOR = { study: 'var(--study)', off: 'var(--off)', away: 'var(--away)', rest: 'var(--rest)' };
  const LABEL = { off: '다른 곳을 봤어요', away: '자리를 비웠어요', rest: '쉬었어요' };
  const sum = k => S.filter(s => s[2] === k).reduce((a, s) => a + s[1] - s[0], 0);
  const total = S.at(-1)[1] - S[0][0];
  const focused = sum('study'), lost = sum('off') + sum('away'), rest = sum('rest');
  const rate = Math.round(focused / total * 100);
  const hm = m => m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m}분`;

  document.getElementById('headline').textContent = `${focused}분 동안 집중했어요`;
  document.getElementById('focused').textContent = hm(focused);
  document.getElementById('lost').textContent = hm(lost);
  document.getElementById('rest').textContent = hm(rest);

  // Planner: rows are hours, 6 cells of 10 one-minute slivers each.
  const at = m => (S.find(s => m >= s[0] && m < s[1]) || [])[2];
  const p = document.getElementById('planner');
  p.insertAdjacentHTML('beforeend', '<div class="m"></div>' + [0, 10, 20, 30, 40, 50].map(n => `<div class="m">${n}</div>`).join(''));
  for (const hour of [14, 15]) {
    let row = `<div class="h">${hour - 12}시</div>`;
    for (let c = 0; c < 6; c++) {
      let cell = '';
      for (let k = 0; k < 10; k++) {
        const st = at((hour - 14) * 60 + c * 10 + k);
        cell += `<i style="background:${st ? COLOR[st] : 'transparent'}"></i>`;
      }
      row += `<div class="cell"><div class="fill">${cell}</div></div>`;
    }
    p.insertAdjacentHTML('beforeend', row);
  }

  // What happened: a real sequence, so times lead each line.
  const t = m => { const h = 14 + Math.floor(m / 60); return `${h > 12 ? h - 12 : h}:${String(m % 60).padStart(2, '0')}`; };
  document.getElementById('log').innerHTML = S.filter(s => s[2] !== 'study')
    .map(s => `<li><time>${t(s[0])}</time><span class="c" style="background:${COLOR[s[2]]}"></span><span>${LABEL[s[2]]}</span><span class="dur">${s[1] - s[0]}분</span></li>`).join('');

  // Week bars (minutes), today last; star = goal reached.
  const W = [[40, '금', 1], [65, '토', 1], [30, '일', 0], [80, '월', 1], [55, '화', 1], [6, '수', 0], [focused, '오늘', 1]];
  const max = Math.max(...W.map(w => w[0]));
  document.getElementById('bars').innerHTML = W.map((w, i) => `<div class="bar${i === 6 ? ' today' : ''}${w[2] ? ' goal' : ''}" title="${w[1]} ${w[0]}분"><i style="height:${Math.max(4, w[0] / max * 86)}%"></i></div>`).join('');
  document.getElementById('days').innerHTML = W.map((w, i) => `<span class="${i === 6 ? 'today' : ''}">${w[1]}</span>`).join('');

  // One orchestrated moment: the ring fills on load (skipped with reduced motion).
  const C = 2 * Math.PI * 52, arc = document.getElementById('arc'), rateEl = document.getElementById('rate');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { arc.setAttribute('stroke-dasharray', `${C * rate / 100} ${C}`); rateEl.textContent = rate + '%'; }
  else {
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - k, 3);
      arc.setAttribute('stroke-dasharray', `${C * rate / 100 * e} ${C}`);
      rateEl.textContent = Math.round(rate * e) + '%';
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
</script>
</body>
</html>
